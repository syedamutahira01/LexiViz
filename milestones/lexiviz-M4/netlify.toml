[build]
  publish = "dist"
  command = "npm run build"

# Route /api/tts directly to the serverless Netlify function
[[redirects]]
  from = "/api/tts"
  to = "/.netlify/functions/tts"
  status = 200

# Single Page App (SPA) redirect for client-side routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
